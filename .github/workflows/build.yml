name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        run: |
          unzip -o -q "$(ls *.zip | head -1)" -d src
          DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "ANDROID_DIR=$DIR" >> $GITHUB_ENV
          echo "GO_DIR=$(dirname "$(find src -name go.mod | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/sshvps.apk"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build EXE
        run: |
          cd "$GO_DIR"
          go mod tidy
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/sshvps.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: hasil-build
          path: |
            sshvps.apk
            sshvps.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            sshvps.apk
            sshvps.exe
